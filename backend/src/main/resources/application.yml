spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: construction-platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:construction_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: HikariPool-ConstructionPlatform

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  liquibase:
    change-log: classpath:db/migration/db.changelog-master.xml
    enabled: ${LIQUIBASE_ENABLED:true}

server:
  port: ${APP_PORT:8080}

schedule:
  # Ngày lễ Việt Nam năm 2026 được loại trừ khỏi thời lượng dự án.
  # Chủ nhật được loại tự động trong CalendarConverter.
  holidays: "2026-01-01,2026-02-14,2026-02-15,2026-02-16,2026-02-17,2026-02-18,2026-02-19,2026-02-20,2026-02-21,2026-04-30,2026-05-01,2026-09-02"

logging:
  level:
    root: INFO
    com.ntdhtcct: DEBUG
    liquibase: INFO
    org.springframework.jdbc: DEBUG

app:
  authorization:
    global-project-role-email: lanc5676@gmail.com
    global-project-role: PROJECT_MANAGER
