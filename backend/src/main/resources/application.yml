spring:
  application:
    name: construction-platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:construction_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: HikariPool-ConstructionPlatform

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  liquibase:
    change-log: classpath:db/migration/db.changelog-master.xml
    enabled: true

server:
  port: ${APP_PORT:8080}

logging:
  level:
    root: INFO
    com.ntdhtcct: DEBUG
    liquibase: INFO
    org.springframework.jdbc: DEBUG
