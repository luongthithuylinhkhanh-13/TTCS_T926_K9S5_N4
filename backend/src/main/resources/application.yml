spring:
  application:
    name: construction-platform

  datasource:
    url: ${DB_URL:jdbc:h2:mem:construction_platform;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.h2.Driver}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: HikariPool-ConstructionPlatform

  jpa:
    open-in-view: false
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  liquibase:
    change-log: classpath:db/migration/db.changelog-master.xml
    enabled: ${LIQUIBASE_ENABLED:false}

server:
  port: ${APP_PORT:8080}

logging:
  level:
    root: INFO
    com.ntdhtcct: DEBUG
    liquibase: INFO
    org.springframework.jdbc: DEBUG
