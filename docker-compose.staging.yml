services:
  postgres:
    image: postgres:18
    container_name: construction-staging-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-construction_staging}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-2911}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-construction_staging}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - staging-network

  backend:
    image: ${DOCKER_IMAGE_NAME}:staging
    container_name: construction-staging-backend
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-construction_staging}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-2911}
      APP_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - staging-network

volumes:
  staging_postgres_data:

networks:
  staging-network:
    driver: bridge