services:
  postgres:
    image: postgres:18
    container_name: construction-staging-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-construction_staging}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-2911}
    ports:
      - "${DB_PUBLISHED_PORT:-5434}:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-construction_staging}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - staging-network

  backend:
    image: ${DOCKER_IMAGE_NAME:-construction-backend}:staging
    container_name: construction-staging-backend
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-construction_staging}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-2911}
      APP_PORT: 5432
    ports:
      - "5432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - staging-network

  postgres-backup:
    image: postgres:18
    container_name: construction-staging-postgres-backup
    restart: always
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - chown postgres:postgres /backups && exec gosu postgres /bin/sh /backup.sh
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${DB_NAME:-construction_staging}
      PGUSER: ${DB_USERNAME:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-2911}
      BACKUP_TIME_UTC: ${BACKUP_TIME_UTC:-19:00}
    volumes:
      - ./database/scripts/backup.sh:/backup.sh:ro
      - ./database/scripts/restore.sh:/restore.sh:ro
      - staging_postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - staging-network

volumes:
  staging_postgres_data:
  staging_postgres_backups:

networks:
  staging-network:
    driver: bridge